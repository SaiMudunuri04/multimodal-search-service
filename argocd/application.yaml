apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multimodal-search-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SaiMudunuri04/multimodal-search-service.git
    targetRevision: main
    path: helm/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: multimodal-search-service
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
